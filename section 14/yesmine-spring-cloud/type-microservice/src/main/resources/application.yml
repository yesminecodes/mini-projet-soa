server:
  port: 8081

spring:
  application:
    name: type
  profiles:
    active: prod
  config:
    import: "optional:configserver:http://localhost:9999/"

  datasource:
    url: 'jdbc:h2:mem:typedb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    discovery:
      enabled: true

eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,refresh
build:
  version: 1.0
author:
  name: "yesmine Game"
  email: "game@yahoo.com"